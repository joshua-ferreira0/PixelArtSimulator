<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pixel Art Simulator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-container">
    <header class="app-header">
      <div class="brand">
        <div class="brand-icon"></div>
        <h1>Pixel Art Simulator</h1>
      </div>

      <div class="header-controls">
        <div class="control-group">
          <label for="grid-size">Canvas</label>
          <select id="grid-size">
            <option value="8">8 x 8</option>
            <option value="16" selected>16 x 16</option>
            <option value="24">24 x 24</option>
            <option value="32">32 x 32</option>
            <option value="48">48 x 48</option>
          </select>
        </div>

        <div class="separator"></div>

        <button id="btn-undo" class="icon-btn" title="Undo (Ctrl+Z)">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M3 10h10a5 5 0 0 1 5 5v2"></path>
            <path d="M7 6L3 10l4 4"></path>
          </svg>
        </button>

        <button id="btn-redo" class="icon-btn" title="Redo (Ctrl+Y)">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 10H11a5 5 0 0 0-5 5v2"></path>
            <path d="M17 6l4 4-4 4"></path>
          </svg>
        </button>

        <button id="btn-clear" class="btn secondary" title="Clear Frame">Clear</button>

        <div class="separator"></div>

        <button id="btn-export-modal" class="btn primary">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
            <polyline points="7 10 12 15 17 10"></polyline>
            <line x1="12" y1="15" x2="12" y2="3"></line>
          </svg>
          Export
        </button>
      </div>
    </header>

    <div class="main-workspace">
      <aside class="sidebar-left">
        <div class="panel-section">
          <div class="section-title">Tools</div>
          <div class="tools-grid">
            <button class="tool-btn active" data-tool="pencil" title="Pencil (P)">
              <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M17 3a2.828 2.828 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"></path>
              </svg>
            </button>
            <button class="tool-btn" data-tool="eraser" title="Eraser (E)">
              <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M18 2l4 4-10 10H8l-4-4 10-10z"></path>
                <path d="M14 6l4 4"></path>
                <path d="M4 20h16"></path>
              </svg>
            </button>
            <button class="tool-btn" data-tool="bucket" title="Fill Bucket (B)">
              <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M19 11L12 4 4.5 11.5a3.5 3.5 0 0 0 0 5L7 19"></path>
                <path d="M5 2l5 5"></path>
                <path d="M2 13h15"></path>
                <path d="M22 20a2 2 0 1 1-4 0c0-1.6 2-3 2-3s2 1.4 2 3z"></path>
              </svg>
            </button>
            <button class="tool-btn" data-tool="picker" title="Color Picker (I)">
              <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M2 22s5-1 7-3l11-11a2.828 2.828 0 0 0-4-4L5 15c-2 2-3 7-3 7z"></path>
                <circle cx="17.5" cy="6.5" r="1.5"></circle>
              </svg>
            </button>
          </div>
        </div>

        <div class="panel-section">
          <div class="section-title">Brush Size</div>
          <div class="brush-sizes">
            <button class="size-btn active" data-size="1">1px</button>
            <button class="size-btn" data-size="2">2px</button>
            <button class="size-btn" data-size="3">3px</button>
          </div>
        </div>

        <div class="panel-section">
          <div class="section-title">Color</div>
          <div class="color-picker-wrapper">
            <input type="color" id="color-input" value="#22c55e">
            <span id="color-hex">#22c55e</span>
          </div>
          <div class="palette-grid" id="palette"></div>
        </div>

        <div class="panel-section">
          <div class="section-title">View Options</div>
          <label class="toggle-control">
            <input type="checkbox" id="toggle-grid" checked>
            <span>Show Grid</span>
          </label>
        </div>
      </aside>

      <main class="canvas-viewport" id="canvas-viewport">
        <div class="canvas-wrapper" id="canvas-wrapper">
          <canvas id="checker-canvas"></canvas>
          <canvas id="paint-canvas"></canvas>
          <canvas id="grid-canvas"></canvas>
          <canvas id="cursor-canvas"></canvas>
        </div>

        <div class="zoom-controls">
          <button id="zoom-out" class="icon-btn" title="Zoom Out">-</button>
          <span id="zoom-level">100%</span>
          <button id="zoom-in" class="icon-btn" title="Zoom In">+</button>
          <button id="zoom-reset" class="icon-btn" title="Reset Zoom">Fit</button>
        </div>
      </main>

      <aside class="sidebar-right">
        <div class="panel-section">
          <div class="section-title">Live Preview</div>
          <div class="preview-box">
            <canvas id="preview-canvas" width="128" height="128"></canvas>
          </div>
        </div>

        <div class="panel-section frames-section">
          <div class="section-title-bar">
            <div class="section-title">Frames</div>
            <button id="btn-add-frame" class="btn small" title="Add Empty Frame">+ Add</button>
          </div>

          <div class="frames-list" id="frames-list"></div>

          <div class="frame-actions">
            <button id="btn-duplicate-frame" class="btn secondary small">Duplicate</button>
            <button id="btn-delete-frame" class="btn secondary small">Delete</button>
          </div>
        </div>
      </aside>
    </div>
  </div>

  <div class="modal-backdrop" id="export-modal">
    <div class="modal">
      <div class="modal-header">
        <h3>Export Artwork</h3>
        <button class="close-btn" id="modal-close">&times;</button>
      </div>
      <div class="modal-body">
        <div class="form-group">
          <label>Export Format</label>
          <div class="radio-group">
            <label class="radio-label">
              <input type="radio" name="export-type" value="single" checked>
              <span>Current Frame (.PNG)</span>
            </label>
            <label class="radio-label">
              <input type="radio" name="export-type" value="spritesheet">
              <span>Spritesheet (.PNG)</span>
            </label>
            <label class="radio-label">
              <input type="radio" name="export-type" value="json">
              <span>Project Data (.JSON)</span>
            </label>
          </div>
        </div>

        <div class="form-group" id="scale-group">
          <label for="export-scale">Image Scale</label>
          <select id="export-scale">
            <option value="1">1x (Original Size)</option>
            <option value="4">4x</option>
            <option value="8">8x</option>
            <option value="16" selected>16x (Recommended)</option>
            <option value="32">32x (High Res)</option>
          </select>
          <small class="helper-text" id="export-dimensions"></small>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn secondary" id="modal-cancel">Cancel</button>
        <button class="btn primary" id="modal-download">Download</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
